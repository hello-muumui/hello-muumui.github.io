<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYelectric — Jeeeun.design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="gnb">
    <a class="gnb__logo" href="./"><img src="images/logo.svg" alt="muumui" width="60" height="40"></a>
    <ul class="gnb__menu">
      <li><a href="./">Work</a></li>
      <li><a href="#" data-about>About</a></li>
    </ul>
  </header>

  <main>
    <section class="section" style="background:#d9efff;">
      <div class="section__inner"><img src="images/hyelectric/01.png" alt="HY Electric 메인 화면" width="1400" height="598.5"></div>
    </section>
    <section class="section" style="background:#07314e;" data-no-reveal>
      <div class="section__inner"><img src="images/hyelectric/02.png" alt="" width="1400" height="1541" loading="lazy"></div>
    </section>
    <section class="section" style="background:#022740;">
      <div class="section__inner"><img src="images/hyelectric/03.png" alt="" width="1400" height="242" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/hyelectric/04.png" alt="" width="1400" height="1158" loading="lazy"></div>
    </section>
    <section class="section" style="background:#0b88e1;">
      <div class="section__inner"><img src="images/hyelectric/05.png" alt="" width="1400" height="671" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/hyelectric/06.png" alt="" width="1400" height="1410" loading="lazy"></div>
    </section>
    <section class="section" style="background:#145886 url(images/hyelectric/07-bg.png) center / cover no-repeat;">
      <div class="section__inner"><img src="images/hyelectric/07.png" alt="" width="1400" height="1052" loading="lazy"></div>
    </section>
    <section class="section" style="background:#eff8ff;" data-no-reveal>
      <div class="section__inner"><img src="images/hyelectric/08.png" alt="" width="1400" height="3108" loading="lazy"></div>
    </section>
    <section class="section" style="background:#cfdce5;" data-no-reveal>
      <div class="section__inner"><img src="images/hyelectric/09.png" alt="" width="1400" height="2622" loading="lazy"></div>
    </section>
    <section class="section" style="background:#0b8ae1;" data-no-reveal>
      <div class="section__inner"><img src="images/hyelectric/10.png" alt="" width="1400" height="1388" loading="lazy"></div>
    </section>

    <section class="section info" style="background:#f5f5f5;">
      <div class="info__inner">
        <div class="info__item">
          <p class="info__label">Period</p>
          <p class="info__value">2017.06 ~ 2017.12</p>
        </div>
        <div class="info__item">
          <p class="info__label">Contribution</p>
          <p class="info__value">기획 40%, 디자인 90%</p>
        </div>
        <div class="info__item">
          <p class="info__label">Role</p>
          <p class="info__value">메인 및 서브 디자인<br>프로젝트 리더</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <p class="site-footer__headline">Have a project<br>in mind?</p>
        <a class="site-footer__btn" href="mailto:jeeeun.design@gmail.com">Get in touch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
      </div>
      <div class="site-footer__col">
        <h2>Contact</h2>
        <a href="mailto:jeeeun.design@gmail.com">jeeeun.design@gmail.com</a>
      </div>
      <div class="site-footer__col">
        <h2>Menu</h2>
        <ul>
          <li><a href="./">Work</a></li>
          <li><a href="#" data-about>About</a></li>
        </ul>
      </div>
    </div>
    <p class="site-footer__copy">© 2026 Jeeeun.design</p>
  </footer>

<script src="js/gnb.js"></script>
  <script src="js/about.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
