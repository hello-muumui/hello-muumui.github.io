<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우주메리 — Jeeeun.design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .wj-hero {
      background-image: linear-gradient(119.73deg, #d2fef8 0%, #d6d1ff 100.78%);
    }
    .wj-tagline {
      position: absolute;
      top: 184px;
      left: 700px;
      margin: 0;
      font-size: 16px;
      line-height: 20px;
      color: rgba(51, 51, 51, 0.8);
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .wj-hero-mockup {
      position: absolute;
      top: 276px;
      left: 549px;
      width: 320px;
      height: 660px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.4);
    }
    .wj-hero-screen {
      position: absolute;
      inset: 10px;
      overflow: hidden;
      border-radius: 32px;
      background: #fff;
    }
    .wj-hero-screen img {
      position: absolute;
      left: 0;
      width: 300px;
    }
    .wj-mock {
      position: absolute;
      top: 160px;
      width: 324px;
      height: 686px;
      border-radius: 44px;
    }
    .wj-screen {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 312px;
      height: 672px;
      overflow: hidden;
      border: 1.2px solid #f1f2f7;
      border-radius: 38px;
      background: #f9f9fb;
    }
    .wj-screen > img {
      position: absolute;
    }
  </style>
</head>

  <header class="gnb">
    <a class="gnb__logo" href="./">Jeeeun.design</a>
    <ul class="gnb__menu">

            </div>
          </div>
        </div>
      </div>
    </section>
