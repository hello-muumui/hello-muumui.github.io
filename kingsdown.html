<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kingsdown — Jeeeun.design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="gnb">
    <a class="gnb__logo" href="./"><img src="images/logo.svg" alt="muumui" width="60" height="40"></a>
    <ul class="gnb__menu">
      <li><a href="./">Work</a></li>
      <li><a href="#" data-about>About</a></li>
    </ul>
  </header>

  <main>
    <section class="section" style="background:#544f4b;">
      <div class="section__inner"><img src="images/kingsdown/01.png" alt="Kingsdown 메인 화면" width="1400" height="600"></div>
    </section>
    <section class="section" style="background:#d6cab7;" data-no-reveal>
      <div class="section__inner"><img src="images/kingsdown/02.png" alt="" width="1400" height="2004" loading="lazy"></div>
    </section>
    <section class="section bg-white" data-no-reveal>
      <div class="section__inner"><img src="images/kingsdown/03.png" alt="" width="1400" height="1146" loading="lazy"></div>
    </section>
    <!-- full-bleed banner -->
    <section class="section" style="background:#eafafe;">
      <img src="images/kingsdown/04.png" alt="" width="4096" height="1120" loading="lazy" style="width:100%; height:auto;">
    </section>
    <section class="section" style="background:#f9f6ed;">
      <div class="section__inner"><img src="images/kingsdown/05.png" alt="" width="1400" height="3419" loading="lazy"></div>
    </section>
    <section class="section" style="background:#d4ccc0;" data-no-reveal>
      <div class="section__inner"><img src="images/kingsdown/06.png" alt="" width="1400" height="1568" loading="lazy"></div>
    </section>
    <section class="section bg-white" data-no-reveal>
      <div class="section__inner"><img src="images/kingsdown/07.png" alt="" width="1400" height="1545" loading="lazy"></div>
    </section>

    <section class="section info" style="background:#f5f5f5;">
      <div class="info__inner">
        <div class="info__item">
          <p class="info__label">Period</p>
          <p class="info__value">2015.06 ~ 2015.09</p>
        </div>
        <div class="info__item">
          <p class="info__label">Contribution</p>
          <p class="info__value">기획 30%, 디자인 90%</p>
        </div>
        <div class="info__item">
          <p class="info__label">Role</p>
          <p class="info__value">메인 및 서브페이지 디자인</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <p class="site-footer__headline">Have a project<br>in mind?</p>
        <a class="site-footer__btn" href="mailto:jeeeun.design@gmail.com">Get in touch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
      </div>
      <div class="site-footer__col">
        <h2>Contact</h2>
        <a href="mailto:jeeeun.design@gmail.com">jeeeun.design@gmail.com</a>
      </div>
      <div class="site-footer__col">
        <h2>Menu</h2>
        <ul>
          <li><a href="./">Work</a></li>
          <li><a href="#" data-about>About</a></li>
        </ul>
      </div>
    </div>
    <p class="site-footer__copy">© 2026 Jeeeun.design</p>
  </footer>

<script src="js/gnb.js"></script>
  <script src="js/about.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
