<!doctype html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">

<body>
  <header class="gnb">
    <a class="gnb__logo" href="./"><img src="images/logo.svg" alt="muumui" width="60" height="40"></a>

      <li><a href="./">Work</a></li>
      <li><a href="#" data-about>About</a></li>

  <main>
    <section class="section" style="background:#7898f3;">
      <div class="section__inner"><img src="images/twd/01.png" alt="TWD 메인 화면" width="1400" height="1085.5"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/twd/02.png" alt="" width="1400" height="804" loading="lazy"></div>
    </section>
    <section class="section" style="background:#eaedf5;">
      <div class="section__inner"><img src="images/twd/03.png" alt="" width="1400" height="984.5" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/twd/04.png" alt="" width="1400" height="779" loading="lazy"></div>
    </section>
    <section class="section" style="background:#eaedf5;">
      <div class="section__inner"><img src="images/twd/05.png" alt="" width="1400" height="984.5" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/twd/06.png" alt="" width="1400" height="1213.5" loading="lazy"></div>

    <section class="section" style="background:#eaedf5;">
      <div class="section__inner"><img src="images/twd/07.png" alt="" width="1400" height="984.5" loading="lazy"></div>
    </section>

    <section class="section info" style="background:#ffffff;">
      <div class="info__inner">
        <div class="info__item">
          <p class="info__label">Period</p>
          <p class="info__value">2018.05 ~ 2018.11</p>
        </div>
        <div class="info__item">
          <p class="info__label">Contribution</p>
          <p class="info__value">기획 30%, 디자인 90%</p>
          <p class="info__note">담당했던 역할에 대한 평균 기여도</p>
        </div>
        <div class="info__item">
          <p class="info__label">Role</p>
          <p class="info__value">메인, 리스트, 공시지원금, 쇼핑가이드</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <p class="site-footer__headline">Have a project<br>in mind?</p>
        <a class="site-footer__btn" href="mailto:jeeeun.design@gmail.com">Get in touch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
      </div>
      <div class="site-footer__col">
        <h2>Contact</h2>
        <a href="mailto:jeeeun.design@gmail.com">jeeeun.design@gmail.com</a>
      </div>
      <div class="site-footer__col">
        <h2>Menu</h2>
        <ul>
          <li><a href="./">Work</a></li>
          <li><a href="#" data-about>About</a></li>
        </ul>

    </div>
    <p class="site-footer__copy">© 2026 muumui</p>

  <script src="js/about.js"></script>
