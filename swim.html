<!doctype html>
<html lang="ko">
<head>

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">

<body>
  <header class="gnb">
    <a class="gnb__logo" href="./"><img src="images/logo.svg" alt="muumui" width="60" height="40"></a>
    <ul class="gnb__menu">
      <li><a href="./">Work</a></li>
      <li><a href="#" data-about>About</a></li>
    </ul>
  </header>

  <main>
    <section class="section" style="background:#00aad0;">
      <div class="section__inner"><img src="images/swim/01.png" alt="KSPO&amp;CO 스포츠센터 수강신청 메인 화면" width="1400" height="600"></div>
    </section>
    <section class="section" style="background:#eafafe;" data-no-reveal>
      <div class="section__inner"><img src="images/swim/02.png" alt="" width="1400" height="1932" loading="lazy"></div>
    </section>

    <section class="section info" style="background:#ffffff;">
      <div class="info__inner">
        <div class="info__item">
          <p class="info__label">Period</p>
          <p class="info__value">2019.11 ~ 2020.01</p>
        </div>
        <div class="info__item">
          <p class="info__label">Contribution</p>
          <p class="info__value">기획 50%, 디자인 90%</p>
        </div>
        <div class="info__item">
          <p class="info__label">Role</p>
          <p class="info__value">메인페이지</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <p class="site-footer__headline">Have a project<br>in mind?</p>
        <a class="site-footer__btn" href="mailto:hello.muumui@gmail.com">Get in touch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
      </div>
      <div class="site-footer__col">
        <h2>Contact</h2>
        <a href="mailto:hello.muumui@gmail.com">hello.muumui@gmail.com</a>
      </div>
      <div class="site-footer__col">
        <h2>Menu</h2>
        <ul>
          <li><a href="./">Work</a></li>
          <li><a href="#" data-about>About</a></li>
        </ul>
      </div>
    </div>
    <p class="site-footer__copy">© 2026 muumui</p>
  </footer>

<script src="js/gnb.js"></script>
