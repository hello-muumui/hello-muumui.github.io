<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KB Stargate — Jeeeun.design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kb-hero {
      background: #ffdf3e;
    }
    .kb-hero .stage {
      width: 1400px;
      height: 1108px;
    }
    .kb-hero__logo {
      position: absolute;
      top: 130px;
      left: 673px;
      width: 55px;
      height: 40px;
    }
    .kb-hero__tagline {
      position: absolute;
      top: 184px;
      left: 700.5px;
      margin: 0;
      font-size: 16px;
      line-height: 20px;
      color: rgba(51, 51, 51, 0.8);
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .kb-hero__mockup {
      position: absolute;
      top: 276px;
      left: 549px;
      width: 320px;
      height: 660px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.4);
    }
    .kb-hero__screen {
      position: absolute;
      inset: 10px;
      border-radius: 32px;
      background: #fff;
    }
    .kb-hero__app {
      position: absolute;
      top: 824px;
      left: 471px;
      width: 144px;
      height: 144px;
      border-radius: 32px;
      overflow: hidden;
      background: #60594e;
    }
  </style>
</head>
<body>
  <header class="gnb">
    <a class="gnb__logo" href="./"><img src="images/logo.svg" alt="muumui" width="60" height="40"></a>
    <ul class="gnb__menu">
      <li><a href="./">Work</a></li>
      <li><a href="#" data-about>About</a></li>
    </ul>
  </header>

  <main>
    <!-- 01 hero -->
    <section class="section kb-hero">
      <div class="section__inner stage-wrap" style="aspect-ratio:1400/1108;">
        <div class="stage stage--zoom">
          <img class="kb-hero__logo" src="images/kbstargate/kb-logo.png" alt="KB">
          <p class="kb-hero__tagline">Stargate Platform SDK App</p>
          <!-- Figma: drop shadows use Multiply blend -->
          <div class="hero-shadow" style="left:549px; top:276px; width:320px; height:660px; border-radius:40px; box-shadow:28px 8px 48px 0 #f1eaf2;"></div>
          <div class="kb-hero__mockup">
            <div class="kb-hero__screen"></div>
            <div class="crop" style="left:73px; top:545px; width:237px; height:81px;">
              <img src="images/kbstargate/app-screen.png" alt="" style="left:-26.62%; top:-650.62%; width:126.66%; height:802.47%;">
            </div>
            <div class="crop" style="left:10px; top:49px; width:300px; height:427px;">
              <img src="images/kbstargate/app-screen.png" alt="KB Stargate 앱 메인 화면" style="left:-0.03%; top:-7.26%; width:100.06%; height:152.22%;">
            </div>
          </div>
          <div class="hero-shadow" style="left:471px; top:824px; width:144px; height:144px; border-radius:32px; box-shadow:20px 8px 60px 0 rgba(205, 189, 207, 0.6);"></div>
          <div class="kb-hero__app">
            <div class="crop" style="left:30px; top:40px; width:90px; height:65px;">
              <img src="images/kbstargate/app-icon.png" alt="" style="left:-41.13%; top:-58.95%; width:181.13%; height:252.63%;">
            </div>
            <div style="position:absolute; left:112px; top:35px; width:12px; height:14px; background:#60594e;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="background:#f5f5f5;">
      <div class="section__inner"><img src="images/kbstargate/02.png" alt="" width="1400" height="630" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/kbstargate/03.png" alt="" width="1400" height="732" loading="lazy"></div>
    </section>
    <section class="section" style="background:#fbf8e8;">
      <div class="section__inner"><img src="images/kbstargate/04.png" alt="" width="1400" height="800" loading="lazy"></div>
    </section>
    <section class="section bg-white">
      <div class="section__inner"><img src="images/kbstargate/05.png" alt="" width="1400" height="1799" loading="lazy"></div>
    </section>
    <section class="section" style="background:#fbf8e8;">
      <div class="section__inner"><img src="images/kbstargate/06.png" alt="" width="1400" height="1203" loading="lazy"></div>
    </section>

    <section class="section info" style="background:#ffffff;">
      <div class="info__inner">
        <div class="info__item">
          <p class="info__label">Period</p>
          <p class="info__value">2019.09 ~ 2019.12</p>
        </div>
        <div class="info__item">
          <p class="info__label">Contribution</p>
          <p class="info__value">기획 50%, 디자인 90%</p>
        </div>
        <div class="info__item">
          <p class="info__label">Role</p>
          <p class="info__value">모바일 화면 전체 디자인</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <p class="site-footer__headline">Have a project<br>in mind?</p>
        <a class="site-footer__btn" href="mailto:jeeeun.design@gmail.com">Get in touch <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
      </div>
      <div class="site-footer__col">
        <h2>Contact</h2>
        <a href="mailto:jeeeun.design@gmail.com">jeeeun.design@gmail.com</a>
      </div>
      <div class="site-footer__col">
        <h2>Menu</h2>
        <ul>
          <li><a href="./">Work</a></li>
          <li><a href="#" data-about>About</a></li>
        </ul>
      </div>
    </div>
    <p class="site-footer__copy">© 2026 Jeeeun.design</p>
  </footer>

<script src="js/stage.js"></script>
  <script src="js/gnb.js"></script>
  <script src="js/about.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
